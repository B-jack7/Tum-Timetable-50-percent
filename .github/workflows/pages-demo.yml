name: Publish empty client preview (optional)

on:
  workflow_dispatch:
    inputs:
      confirm_static_demo:
        description: Publish the empty static client preview only; no login backend or personal data.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: static-demo-pages
  cancel-in-progress: true

jobs:
  build:
    if: inputs.confirm_static_demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy empty client preview
        id: deployment
        uses: actions/deploy-pages@v4
